[build]
  publish = "public"

[dev]
  framework = "#static"
  publish = "public"
  port = 8971
  autoLaunch = false

[functions]
  node_bundler = "esbuild"
  included_files = ["knowledge/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

